

<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0B1220">

  <title>Cuenta — marketWeb</title>

  <style>

    :root {

      color-scheme: dark;

      --bg: #0B1220;

      --card: #151F32;

      --ink: #F5F7FF;

      --muted: #A9B4CF;

      --line: #25324B;

      --blue: #3867FF;

      --accent: #8BA7FF;

      --error: #ff9db1;

    }

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 24px 16px;

      display: grid;

      place-items: center;

      background: radial-gradient(700px 400px at 50% 0%, #3867FF30, transparent 70%), var(--bg);

      color: var(--ink);

      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;

    }

    .card {

      width: 100%;

      max-width: 420px;

      padding: 28px;

      border: 1px solid var(--line);

      border-radius: 20px;

      background: var(--card);

      box-shadow: 0 24px 70px #0004;

    }

    .brand {

      text-align: center;

      font-size: 28px;

      font-weight: 850;

      letter-spacing: -1px;

    }

    .brand span { color: var(--accent); }

    h1 { text-align: center; font-size: 23px; margin: 22px 0 8px; }

    .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    label { display: block; font-size: 13px; font-weight: 650; margin: 16px 0 7px; }

    input {

      width: 100%;

      padding: 13px 12px;

      border: 1px solid var(--line);

      border-radius: 10px;

      background: var(--bg);

      color: var(--ink);

      outline: none;

    }

    input:focus { border-color: var(--accent); }

    button {

      width: 100%;

      padding: 13px;

      border: 0;

      border-radius: 10px;

      background: var(--blue);

      color: white;

      font-weight: 750;

      font-size: 15px;

      margin-top: 18px;

      cursor: pointer;

    }

    button:disabled { opacity: .6; cursor: wait; }

    .secondary {

      background: transparent;

      border: 1px solid var(--line);

      margin-top: 10px;

    }

    #message {

      font-size: 13px;

      line-height: 1.5;

      margin-top: 16px;

      overflow-wrap: anywhere;

    }

    .hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.5; }

    a { color: var(--accent); }

    [hidden] { display: none !important; }

  </style>

</head>

<body>

  <main class="card">

    <div class="brand">market<span>Web</span></div>

    <h1 id="heading">Tu espacio creativo</h1>

    <p class="sub" id="subtitle">Ingresá o creá tu cuenta para continuar.</p>

    <form id="auth-form">

      <label for="email">Correo electrónico</label>

      <input id="email" type="email" autocomplete="email"

        placeholder="vos@ejemplo.com" required maxlength="254">

      <label for="password">Contraseña</label>

      <input id="password" type="password"

        autocomplete="current-password" minlength="8"

        placeholder="Mínimo 8 caracteres" required>

      <button id="submit" type="submit">Iniciar sesión</button>

    </form>

    <button class="secondary" id="toggle" type="button">

      Crear una cuenta

    </button>

    <button class="secondary" id="logout" type="button" hidden>

      Cerrar sesión

    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="hint">

      Si el registro solicita confirmar tu correo, revisá tu bandeja de entrada.

      No compartas tu contraseña con nadie.

    </p>

  </main>

  <script type="module">

    import { createClient } from

      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =

      "https://msxmhgxsjlgfdlhirikj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_6wS64xCMk4_073N2xbLJ4Q_1GYzALcq";

    const supabase = createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const form = document.getElementById("auth-form");

    const emailInput = document.getElementById("email");

    const passwordInput = document.getElementById("password");

    const submit = document.getElementById("submit");

    const toggle = document.getElementById("toggle");

    const logout = document.getElementById("logout");

    const heading = document.getElementById("heading");

    const subtitle = document.getElementById("subtitle");

    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, error = false) {

      message.textContent = text;

      message.style.color = error ? "var(--error)" : "var(--accent)";

    }

    function setMode(nextMode) {

      mode = nextMode;

      const signup = mode === "signup";

      heading.textContent = signup ? "Crear tu cuenta" : "Bienvenido";

      subtitle.textContent = signup

        ? "Registrate para empezar con marketWeb."

        : "Ingresá a tu espacio creativo.";

      submit.textContent = signup ? "Crear cuenta" : "Iniciar sesión";

      toggle.textContent = signup

        ? "Ya tengo una cuenta"

        : "Crear una cuenta";

      passwordInput.autocomplete = signup

        ? "new-password" : "current-password";

      showMessage("");

    }

    toggle.addEventListener("click", () => {

      setMode(mode === "login" ? "signup" : "login");

    });

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      submit.disabled = true;

      toggle.disabled = true;

      showMessage("Procesando...");

      try {

        const email = emailInput.value.trim();

        const password = passwordInput.value;

        let result;

        if (mode === "signup") {

          result = await supabase.auth.signUp({

            email,

            password,

            options: {

              emailRedirectTo: window.location.origin + "/auth.html"

            }

          });

        } else {

          result = await supabase.auth.signInWithPassword({

            email,

            password

          });

        }

        if (result.error) throw result.error;

        if (mode === "signup" && !result.data.session) {

          showMessage(

            "Cuenta solicitada. Si la confirmación por correo está activada, revisá tu email para verificarla."

          );

        } else {

          showMessage(

            mode === "signup"

              ? "¡Cuenta creada e iniciada!"

              : "¡Sesión iniciada!"

          );

        }

        await updateSession();

      } catch (error) {

        showMessage(

          error.message || "No se pudo completar la operación.",

          true

        );

      } finally {

        submit.disabled = false;

        toggle.disabled = false;

      }

    });

    async function updateSession() {

      const { data, error } = await supabase.auth.getSession();

      if (error) {

        showMessage("No se pudo comprobar la sesión.", true);

        return;

      }

      const signedIn = Boolean(data.session);

      logout.hidden = !signedIn;

      form.hidden = signedIn;

      toggle.hidden = signedIn;

      if (signedIn) {

        heading.textContent = "¡Bienvenido a marketWeb!";

        subtitle.textContent =

          "Sesión iniciada con " + data.session.user.email;

        showMessage(

          "Tu cuenta funciona. El guardado de proyectos todavía debe conectarse."

        );

      } else {

        setMode(mode);

      }

    }

    logout.addEventListener("click", async () => {

      logout.disabled = true;

      const { error } = await supabase.auth.signOut();

      logout.disabled = false;

      if (error) {

        showMessage("No se pudo cerrar la sesión.", true);

        return;

      }

      showMessage("Sesión cerrada.");

      await updateSession();

    });

    await updateSession();

  </script>

</body>

</html>
