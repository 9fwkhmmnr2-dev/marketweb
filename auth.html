<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1220">
<title>Cuenta — marketWeb</title>
<style>
:root{color-scheme:dark;--bg:#0B1220;--card:#151F32;--ink:#F5F7FF;--muted:#A9B4CF;--line:#25324B;--blue:#3867FF;--accent:#8BA7FF;--error:#ff9db1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(700px 400px at 50% 0%,#3867FF30,transparent 70%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:420px;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 24px 70px #0004}
.brand{text-align:center;font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--accent)}
h1{text-align:center;font-size:23px;margin:22px 0 8px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}input{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}input:focus{border-color:var(--accent)}
button,.button{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--blue);color:white;font-weight:750;font-size:15px;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none}
button:disabled{opacity:.6;cursor:wait}.secondary{background:transparent;border:1px solid var(--line);margin-top:10px}
#message{font-size:13px;line-height:1.5;margin-top:16px;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5}a{color:var(--accent)}[hidden]{display:none!important}
</style>
</head>
<body><main class="card">
<div class="brand">market<span>Web</span></div>
<h1 id="heading">Tu espacio creativo</h1>
<p class="sub" id="subtitle">Ingresá o creá tu cuenta para continuar.</p>
<form id="auth-form">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="vos@ejemplo.com" required maxlength="254">
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Mínimo 8 caracteres" required>
<button id="submit" type="submit">Iniciar sesión</button>
</form>
<button class="secondary" id="toggle" type="button">Crear una cuenta</button>
<button class="secondary" id="logout" type="button" hidden>Cerrar sesión</button>
<a class="button" id="continue" href="index.html" hidden>Ir al catálogo</a>
<p id="message" role="status" aria-live="polite"></p>
<p class="hint">Si el registro solicita confirmar tu correo, revisá tu bandeja de entrada. No compartas tu contraseña con nadie.</p>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient("https://msxmhgxsjlgfdlhirikj.supabase.co","sb_publishable_6wS64xCMk4_073N2xbLJ4Q_1GYzALcq");
const $=id=>document.getElementById(id), form=$("auth-form"), emailInput=$("email"), passwordInput=$("password"), submit=$("submit"), toggle=$("toggle"), logout=$("logout"), heading=$("heading"), subtitle=$("subtitle"), message=$("message"), go=$("continue");
let mode="login";
function showMessage(t,error=false){message.textContent=t;message.style.color=error?"var(--error)":"var(--accent)"}
function setMode(next){mode=next;const signup=mode==="signup";heading.textContent=signup?"Crear tu cuenta":"Bienvenido";subtitle.textContent=signup?"Registrate para empezar con marketWeb.":"Ingresá a tu espacio creativo.";submit.textContent=signup?"Crear cuenta":"Iniciar sesión";toggle.textContent=signup?"Ya tengo una cuenta":"Crear una cuenta";passwordInput.autocomplete=signup?"new-password":"current-password";showMessage("")}
toggle.addEventListener("click",()=>setMode(mode==="login"?"signup":"login"));
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;toggle.disabled=true;showMessage("Procesando…");try{
 const email=emailInput.value.trim(),password=passwordInput.value;let result;
 if(mode==="signup") result=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/auth.html"}});
 else result=await supabase.auth.signInWithPassword({email,password});
 if(result.error)throw result.error;
 if(mode==="signup"&&!result.data.session)showMessage("Cuenta solicitada. Revisá tu correo si se requiere confirmación.");
 else {showMessage("Sesión iniciada. Abriendo el catálogo…");location.replace("index.html");return}
 await updateSession();
 }catch(err){showMessage(err.message||"No se pudo completar la operación.",true)}finally{submit.disabled=false;toggle.disabled=false}});
async function updateSession(){const {data,error}=await supabase.auth.getSession();if(error){showMessage("No se pudo comprobar la sesión.",true);return}
 const signed=!!data.session;logout.hidden=!signed;form.hidden=signed;toggle.hidden=signed;go.hidden=!signed;
 if(signed){location.replace("index.html");return;}
 else setMode(mode)}
logout.addEventListener("click",async()=>{logout.disabled=true;const {error}=await supabase.auth.signOut();logout.disabled=false;if(error){showMessage("No se pudo cerrar la sesión.",true);return}showMessage("Sesión cerrada.");await updateSession()});
await updateSession();
</script></body></html>
